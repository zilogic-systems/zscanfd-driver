[package]
name = "zscanfd-driver"
version = "0.3.0"
authors = ["Eric Evenchick <eric@evenchick.com>", "Vijay Kumar <vijaykumar@zilogic.com>", "Navin Jared Czernev <navinkumar.j@zilogic.com>", "Godson Gnanaraj <godson@zilogic.com>", "Arunkumar <arunkumar.m@zilogic.com>"]
license = "MIT"
keywords = ["can", "usb", "driver"]
categories = ["command-line-utilities", "hardware-support"]
repository = "https://github.com/zilogic-systems/zscanfd-driver"
homepage = "ToDo:Add http://zscanfd.io/"
readme = "../README.md"
description = "Driver and API for zscanfd Controller Area Network tools."

edition = "2018"
build = "build.rs"

[lib]
name = "zscanfd"
crate-type = ["cdylib", "rlib"]

[features]
python = ["pyo3"]

[dependencies]
libusb1-sys = {version = "0.3" }
libc = "0.2.71"
crossbeam-channel = "0.4"
serde = { version = "1.0", features = ["derive"]}
pyo3 = { version = "0.10.1", features = ["extension-module"], optional = true}
