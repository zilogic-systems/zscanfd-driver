[package]
name = "zscanfd"
version = "0.3.0"
authors = ["Eric Evenchick <eric@evenchick.com>", "Vijay Kumar <vijaykumar@zilogic.com>", "Navin Jared Czernev <navinkumar.j@zilogic.com>", "Godson Gnanaraj <godson@zilogic.com>", "Arunkumar <arunkumar.m@zilogic.com>"]
license = "MIT"
keywords = ["can", "usb"]
categories = ["command-line-utilities", "hardware-support"]
repository = "https://github.com/zilogic-systems/zscanfd-driver"
homepage = "ToDo:Add http://zscanfd.io/"
readme = "README.md"
description = "CLI for zscanfd Controller Area Network tools."

edition = "2018"
default-run="can"

[workspace]
members = ['driver']

[[bin]]
name = "can"
path = "src/main.rs"

[dependencies]
zscanfd-driver = {path = "driver", version = "0.3.0"}
ctrlc = "3.1.4"
clap = { version = "2.33.3", features = ["yaml"]}
toml = "0.5.6"
serde = { version = "1.0", features = ["derive"]}
app_dirs = "1.2.1"
log = "0.4.8"
simplelog = "0.8.0"
